<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chennai Day Outing — Scoreboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07091C;--surf:#0D1035;--surf2:#141740;
  --border:rgba(255,255,255,.1);
  --gold:#F5C842;--teal:#2DD4BF;--text:#F0F0FF;
  --text2:rgba(240,240,255,.6);--text3:rgba(240,240,255,.35);
  --pink:#FB7185;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}

/* ── HEADER ── */
.site-header{position:relative;overflow:hidden;padding:44px 24px 36px;text-align:center;border-bottom:1px solid var(--border)}
.hdr-bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:.07;pointer-events:none}
.hdr-logo-bg{position:absolute;inset:0;background:url('bg.png') center/30% no-repeat;opacity:.06;pointer-events:none}
.hdr-fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,9,28,0) 0%,rgba(7,9,28,.7) 100%);pointer-events:none}
.hdr-content{position:relative;z-index:2}
.palm-dec{font-size:2.2rem;letter-spacing:16px;opacity:.65;margin-bottom:12px}
.site-logo{height:70px;margin-bottom:14px;filter:drop-shadow(0 0 24px rgba(245,200,66,.35))}
.site-title{font-size:2rem;font-weight:900;color:var(--gold);letter-spacing:.5px}
.site-sub{font-size:.82rem;color:var(--text2);margin-top:6px;letter-spacing:3px;text-transform:uppercase}

/* ── MAIN ── */
main{max-width:1060px;margin:0 auto;padding:30px 18px 70px}
.sec-lbl{font-size:.6rem;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--text3);margin-bottom:12px}

/* ── LEADERBOARD ── */
.leaderboard{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:36px}
.lb-card{
  background:var(--surf);border:1.5px solid var(--border);border-radius:18px;
  padding:22px 14px;text-align:center;position:relative;overflow:hidden;
  transition:transform .2s
}
.lb-card::after{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--tc,rgba(255,255,255,.15))}
.lb-card.gold-card{border-color:rgba(245,200,66,.4);background:rgba(245,200,66,.06)}
.lb-card.gold-card::after{background:var(--gold);height:5px}
.lb-rank{font-size:2rem;line-height:1;margin-bottom:8px}
.lb-name{font-size:.75rem;font-weight:700;letter-spacing:.5px;color:var(--text2);margin-bottom:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.lb-score{font-size:3rem;font-weight:900;line-height:1;color:var(--tc,var(--text))}
.lb-card.gold-card .lb-score{color:var(--gold)}
.lb-pts{font-size:.55rem;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-top:4px}
.lb-logo{width:60px;height:60px;object-fit:contain;border-radius:10px;margin:6px 0 2px}

/* ── TABLE ── */
.act-wrap{background:var(--surf);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:14px}
.act-table{width:100%;border-collapse:collapse}
.act-table th{
  padding:12px 10px;font-size:.6rem;font-weight:800;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border);text-align:center
}
.act-table th.lc{text-align:left;padding-left:18px}
.act-table td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.04);text-align:center}
.act-table tr:last-child td{border-bottom:none}
.act-table td.lc{padding-left:18px;text-align:left}

.act-name-inp{
  background:transparent;border:none;color:var(--text);font-size:.85rem;
  font-family:inherit;width:100%;outline:none;cursor:pointer
}
.act-name-inp:focus{border-bottom:1px dashed var(--teal);cursor:text}

.score-ctrl{display:inline-flex;align-items:center;gap:5px}
.sc-btn{
  background:var(--surf2);border:1px solid var(--border);border-radius:7px;
  color:var(--text);font-size:1rem;font-weight:700;font-family:inherit;
  width:30px;height:30px;cursor:pointer;line-height:1;
  transition:border-color .12s,background .12s;flex-shrink:0
}
.sc-btn:hover{background:var(--surf);border-color:rgba(255,255,255,.3)}
.sc-btn.minus:hover{border-color:var(--pink);color:var(--pink)}
.sc-btn.plus:hover{border-color:var(--teal);color:var(--teal)}
.sc-val{
  min-width:38px;text-align:center;font-size:1rem;font-weight:800;
  color:var(--text);cursor:pointer;border-bottom:1.5px solid transparent;
  transition:border-color .15s;padding:1px 2px;border-radius:3px;
  outline:none
}
.sc-val:hover{border-bottom-color:rgba(255,255,255,.25)}
.sc-val:focus{border-bottom-color:var(--teal);background:rgba(45,212,191,.07)}

.del-btn{
  background:none;border:none;color:var(--text3);font-size:.9rem;
  cursor:pointer;padding:4px 9px;border-radius:6px;transition:color .15s,background .15s
}
.del-btn:hover{color:var(--pink);background:rgba(251,113,133,.1)}

.total-row td{
  font-weight:900;background:rgba(255,255,255,.03);
  border-top:1.5px solid var(--border)!important
}
.total-row .lc{font-size:.62rem;color:var(--text3);letter-spacing:2px;text-transform:uppercase}
.total-val{font-size:1.15rem;font-weight:900}

/* team header chips */
.th-chip{
  display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.05);
  border-radius:20px;padding:2px 10px;font-size:.62rem;font-weight:700;
  letter-spacing:.5px;border:1px solid var(--border)
}
.th-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* ── ADD BUTTON ── */
.add-act-btn{
  display:flex;align-items:center;gap:8px;background:none;
  border:1.5px dashed rgba(255,255,255,.15);border-radius:10px;color:var(--text2);
  font-size:.82rem;padding:10px 18px;cursor:pointer;width:100%;
  font-family:inherit;transition:border-color .15s,color .15s;margin-bottom:16px
}
.add-act-btn:hover{border-color:var(--teal);color:var(--teal)}

/* ── CONTROLS ── */
.controls-row{display:flex;gap:10px;flex-wrap:wrap}
.ctrl-btn{
  background:none;border:1.5px solid var(--border);border-radius:10px;
  color:var(--text2);font-size:.78rem;padding:8px 16px;cursor:pointer;
  font-family:inherit;transition:border-color .15s,color .15s,background .15s
}
.ctrl-btn:hover{border-color:rgba(255,255,255,.35);color:var(--text)}
.ctrl-btn.danger:hover{border-color:var(--pink);color:var(--pink);background:rgba(251,113,133,.07)}

/* ── MODAL ── */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s
}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{
  background:var(--surf);border:1px solid rgba(255,255,255,.12);
  border-radius:20px;padding:28px 24px;width:360px;max-width:94vw
}
.modal-title{font-size:1rem;font-weight:800;color:var(--gold);margin-bottom:20px}
.name-inp-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.color-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.name-inp{
  flex:1;background:var(--surf2);border:1.5px solid var(--border);
  border-radius:8px;color:var(--text);font-size:.85rem;
  padding:7px 11px;font-family:inherit;outline:none;transition:border-color .15s
}
.name-inp:focus{border-color:var(--teal)}
.modal-btns{display:flex;gap:8px;margin-top:20px}
.btn-save{
  flex:1;background:var(--gold);color:#07091C;border:none;
  border-radius:10px;font-weight:800;font-size:.85rem;
  padding:10px;cursor:pointer;font-family:inherit
}
.btn-cancel{
  background:none;border:1.5px solid var(--border);border-radius:10px;
  color:var(--text2);font-size:.85rem;padding:10px 16px;cursor:pointer;font-family:inherit
}

/* ── WINNER BANNER ── */
.winner-bar{
  display:none;background:rgba(245,200,66,.1);border:1.5px solid rgba(245,200,66,.35);
  border-radius:14px;padding:14px 20px;margin-bottom:28px;text-align:center;
  font-size:1.1rem;font-weight:800;color:var(--gold)
}
.winner-bar.show{display:block}

/* ── WINNER ANNOUNCE OVERLAY ── */
.wa-ov{
  position:fixed;inset:0;z-index:500;background:rgba(7,9,28,.93);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .5s ease
}
.wa-ov.show{opacity:1;pointer-events:all}
#wa-confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wa-inner{position:relative;z-index:2;text-align:center;padding:20px}
.wa-rays{
  position:absolute;inset:0;z-index:1;
  background:conic-gradient(from 0deg,transparent 0%,rgba(245,200,66,.04) 5%,transparent 10%,transparent 45%,rgba(245,200,66,.04) 50%,transparent 55%);
  animation:waRaySpin 12s linear infinite
}
@keyframes waRaySpin{to{transform:rotate(360deg)}}
.wa-medal{
  font-size:5.5rem;line-height:1;display:block;
  animation:waBounceIn .7s cubic-bezier(.36,2,.6,1) both;
  animation-delay:.15s
}
@keyframes waBounceIn{
  from{transform:scale(0) rotate(-30deg);opacity:0}
  to{transform:scale(1) rotate(0deg);opacity:1}
}
.wa-tag{
  font-size:.65rem;font-weight:900;letter-spacing:7px;color:var(--gold);
  text-transform:uppercase;margin:16px 0 6px;
  animation:waUp .5s ease both;animation-delay:.65s
}
@keyframes waUp{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
.wa-name{
  font-size:3.2rem;font-weight:900;color:var(--gold);line-height:1.1;
  animation:waPop .55s cubic-bezier(.36,1.5,.6,1) both;animation-delay:.9s;
  text-shadow:0 0 60px rgba(245,200,66,.5)
}
@keyframes waPop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.wa-pts{
  font-size:1.1rem;color:var(--text2);margin-top:10px;font-weight:600;
  animation:waUp .5s ease both;animation-delay:1.25s
}
.wa-tie-names{
  display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:8px;
  animation:waPop .55s cubic-bezier(.36,1.5,.6,1) both;animation-delay:.9s
}
.wa-tie-chip{
  background:rgba(245,200,66,.12);border:1.5px solid rgba(245,200,66,.4);
  border-radius:10px;padding:8px 18px;font-size:1.3rem;font-weight:900;color:var(--gold)
}
.wa-close-btn{
  margin-top:34px;background:none;border:1.5px solid rgba(255,255,255,.2);
  border-radius:12px;color:rgba(255,255,255,.45);font-size:.82rem;
  padding:9px 26px;cursor:pointer;font-family:inherit;
  transition:border-color .15s,color .15s;
  animation:waUp .5s ease both;animation-delay:1.55s
}
.wa-close-btn:hover{border-color:rgba(255,255,255,.5);color:var(--text)}
.announce-btn{
  background:linear-gradient(135deg,rgba(245,200,66,.2),rgba(245,200,66,.08));
  border:1.5px solid var(--gold);border-radius:10px;color:var(--gold);
  font-size:.85rem;font-weight:800;padding:10px 20px;cursor:pointer;
  font-family:inherit;transition:background .15s,transform .1s;letter-spacing:.3px
}
.announce-btn:hover{background:rgba(245,200,66,.2);transform:translateY(-1px)}
.announce-btn:active{transform:scale(.97)}

@media(max-width:680px){
  .leaderboard{grid-template-columns:repeat(2,1fr)}
  .site-title{font-size:1.4rem}
  .lb-score{font-size:2.2rem}
  .score-inp{width:52px;font-size:.85rem}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="hdr-logo-bg"></div>
  <img src="bg.png" class="hdr-bg-img" alt="" onerror="this.style.display='none'">
  <div class="hdr-fade"></div>
  <div class="hdr-content">
    <img src="logo.png" class="site-logo" alt="AI-YoYo" onerror="this.style.display='none'">
    <div class="site-title">Chennai Day Outing</div>
    <div class="site-sub">Games Scoreboard</div>
  </div>
</header>

<main>
  <div class="winner-bar" id="winner-bar"></div>

  <div class="sec-lbl">🏆 Leaderboard</div>
  <div class="leaderboard" id="leaderboard"></div>

  <div class="sec-lbl">📋 Activity Scores</div>
  <div class="act-wrap">
    <table class="act-table">
      <thead id="act-thead"></thead>
      <tbody id="act-tbody"></tbody>
      <tfoot id="act-tfoot"></tfoot>
    </table>
  </div>

  <button class="add-act-btn" onclick="addActivity()">＋ Add Activity / Game</button>

  <div style="margin-bottom:16px">
    <button class="announce-btn" onclick="announceWinner()">🏆 Announce Winner</button>
  </div>

  <div class="controls-row">
    <button class="ctrl-btn" onclick="openNames()">✏️ Edit Team Names</button>
    <button class="ctrl-btn danger" onclick="resetAll()">↺ Reset All Scores</button>
    <a href="index.html" class="ctrl-btn" style="text-decoration:none;display:inline-flex;align-items:center">🎮 Back to Hangman</a>
  </div>
</main>

<!-- Winner announce overlay -->
<div class="wa-ov" id="wa-ov">
  <div class="wa-rays"></div>
  <canvas id="wa-confetti"></canvas>
  <div class="wa-inner" id="wa-inner"></div>
</div>

<!-- Edit names modal -->
<div class="modal-bg" id="names-modal">
  <div class="modal">
    <div class="modal-title">Edit Team Names</div>
    <div id="names-inputs"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeNames()">Cancel</button>
      <button class="btn-save" onclick="saveNames()">Save</button>
    </div>
  </div>
</div>

<script>
'use strict';
const TC = ['#FF8C42','#2DD4BF','#A78BFA','#FB7185'];
const RANKS = ['1️⃣','2️⃣','3️⃣','4️⃣'];
const TEAM_DEFAULTS = [
  {name:'Gemini Jammuni', logo:'team1.png'},
  {name:'Claude Naadu',   logo:'team2.png'},
  {name:'Crow Pilot',     logo:'team3.png'},
  {name:'Chat Cappi Tea', logo:'team4.png'}
];

let state = load();

function load(){
  try{
    const s=JSON.parse(localStorage.getItem('chennai_outing_sb'));
    if(s&&s.teams&&s.activities) return s;
  }catch(e){}
  return {
    teams:TEAM_DEFAULTS.map((t,i)=>({name:t.name,color:TC[i]})),
    activities:[{name:'Hangman',scores:[0,0,0,0]}]
  };
}

function save(){localStorage.setItem('chennai_outing_sb',JSON.stringify(state));}

function totals(){
  return state.teams.map((_,ti)=>
    state.activities.reduce((s,a)=>s+(parseInt(a.scores[ti])||0),0)
  );
}

function render(){
  const tot=totals();
  const order=[...state.teams.keys()].sort((a,b)=>tot[b]-tot[a]);

  // Winner banner
  const wb=document.getElementById('winner-bar');
  const maxPts=Math.max(...tot);
  if(maxPts>0){
    const winners=state.teams.filter((_,i)=>tot[i]===maxPts);
    wb.className='winner-bar show';
    wb.textContent=winners.length===1
      ? '🏆 '+winners[0].name+' is leading with '+maxPts+' pts!'
      : '🤝 Tied! '+winners.map(t=>t.name).join(' & ')+' — '+maxPts+' pts';
  } else {
    wb.className='winner-bar';
  }

  // Leaderboard
  document.getElementById('leaderboard').innerHTML=order.map((ti,pos)=>{
    const t=state.teams[ti];
    return `<div class="lb-card${pos===0?' gold-card':''}" style="--tc:${t.color}">
      <div class="lb-rank">${RANKS[pos]}</div>
      <img class="lb-logo" src="${TEAM_DEFAULTS[ti].logo}" alt=""
        onerror="this.style.display='none'">
      <div class="lb-name">${esc(t.name)}</div>
      <div class="lb-score">${tot[ti]}</div>
      <div class="lb-pts">points</div>
    </div>`;
  }).join('');

  // Table header
  document.getElementById('act-thead').innerHTML=`<tr>
    <th class="lc">Activity</th>
    ${state.teams.map((t,i)=>`<th>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
        <img src="${TEAM_DEFAULTS[i].logo}" style="width:32px;height:32px;object-fit:contain;border-radius:6px" onerror="this.style.display='none'">
        <span class="th-chip">
          <span class="th-dot" style="background:${t.color}"></span>${esc(t.name)}
        </span>
      </div>
    </th>`).join('')}
    <th></th>
  </tr>`;

  // Table body
  document.getElementById('act-tbody').innerHTML=state.activities.map((a,ai)=>`
    <tr>
      <td class="lc">
        <input class="act-name-inp" value="${esc(a.name)}"
          onchange="renameAct(${ai},this.value)" title="Click to rename">
      </td>
      ${state.teams.map((t,ti)=>`<td>
        <div class="score-ctrl">
          <button class="sc-btn minus" onclick="adjScore(${ai},${ti},-5)">−</button>
          <span class="sc-val" style="color:${t.color}"
            contenteditable="true" inputmode="numeric"
            onblur="commitScore(${ai},${ti},this)"
            onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"
            onclick="event.stopPropagation();selectAll(this)"
          >${a.scores[ti]||0}</span>
          <button class="sc-btn plus" onclick="adjScore(${ai},${ti},5)">+</button>
        </div>
      </td>`).join('')}
      <td><button class="del-btn" onclick="delActivity(${ai})" title="Remove">✕</button></td>
    </tr>`).join('');

  // Table footer
  document.getElementById('act-tfoot').innerHTML=`<tr class="total-row">
    <td class="lc">TOTAL</td>
    ${tot.map((v,i)=>`<td>
      <span class="total-val" style="color:${state.teams[i].color}">${v}</span>
    </td>`).join('')}
    <td></td>
  </tr>`;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
}

function adjScore(ai,ti,delta){
  state.activities[ai].scores[ti]=Math.max(0,(state.activities[ai].scores[ti]||0)+delta);
  save();
  render();
}

function commitScore(ai,ti,el){
  const v=Math.max(0,parseInt(el.textContent)||0);
  state.activities[ai].scores[ti]=v;
  save();
  render();
}

function selectAll(el){
  const r=document.createRange();
  r.selectNodeContents(el);
  const s=window.getSelection();
  s.removeAllRanges();
  s.addRange(r);
}

function renameAct(ai,name){
  state.activities[ai].name=name.trim()||'Activity '+(ai+1);
  save();
}

function addActivity(){
  state.activities.push({name:'Activity '+(state.activities.length+1),scores:[0,0,0,0]});
  save();
  render();
  const rows=document.querySelectorAll('.act-name-inp');
  if(rows.length) rows[rows.length-1].focus();
}

function delActivity(ai){
  if(state.activities.length<=1){alert('Keep at least one activity.');return;}
  if(!confirm('Remove "'+state.activities[ai].name+'"?')) return;
  state.activities.splice(ai,1);
  save();render();
}

function resetAll(){
  if(!confirm('Reset ALL scores to 0?')) return;
  state.activities.forEach(a=>a.scores=[0,0,0,0]);
  save();render();
}

function openNames(){
  document.getElementById('names-inputs').innerHTML=state.teams.map((t,i)=>`
    <div class="name-inp-row">
      <div class="color-dot" style="background:${t.color}"></div>
      <input class="name-inp" id="ni-${i}" value="${esc(t.name)}" placeholder="Team ${i+1}">
    </div>`).join('');
  document.getElementById('names-modal').classList.add('open');
}

function closeNames(){document.getElementById('names-modal').classList.remove('open');}

function saveNames(){
  state.teams.forEach((t,i)=>{
    const v=(document.getElementById('ni-'+i).value||'').trim();
    if(v) t.name=v;
  });
  save();closeNames();render();
}

document.getElementById('names-modal').addEventListener('click',function(e){
  if(e.target===this) closeNames();
});

// ── WINNER ANNOUNCEMENT ──
let waFrame=null, waParticles=[];

function announceWinner(){
  const tot=totals();
  const max=Math.max(...tot);
  const winIdx=state.teams.reduce((best,_,i)=>tot[i]>tot[best]?i:best,0);
  const winners=state.teams.filter((_,i)=>tot[i]===max);
  const isTie=winners.length>1;

  const inner=document.getElementById('wa-inner');
  if(isTie){
    inner.innerHTML=`
      <div class="wa-medal" style="font-size:4rem">🤝</div>
      <div class="wa-tag">It's a Tie!</div>
      <div class="wa-tie-names">${winners.map(t=>`<div class="wa-tie-chip">${esc(t.name)}</div>`).join('')}</div>
      <div class="wa-pts">${max} points each</div>
      <button class="wa-close-btn" onclick="closeAnnounce()">✕ Close</button>`;
  } else {
    const w=winners[0];
    inner.innerHTML=`
      <div class="wa-medal">1️⃣</div>
      <div class="wa-tag" style="color:${w.color}">Winner!</div>
      <div class="wa-name" style="color:${w.color};text-shadow:0 0 60px ${w.color}80">${esc(w.name)}</div>
      <div class="wa-pts">${max} points</div>
      <button class="wa-close-btn" onclick="closeAnnounce()">✕ Close</button>`;
  }

  document.getElementById('wa-ov').classList.add('show');
  startWAConfetti();
}

function closeAnnounce(){
  document.getElementById('wa-ov').classList.remove('show');
  stopWAConfetti();
}

function startWAConfetti(){
  const cv=document.getElementById('wa-confetti');
  cv.width=window.innerWidth; cv.height=window.innerHeight;
  const ctx=cv.getContext('2d');
  const colors=['#F5C842','#2DD4BF','#FF8C42','#FB7185','#A78BFA','#ffffff'];
  waParticles=Array.from({length:140},()=>({
    x:Math.random()*cv.width, y:-10-Math.random()*200,
    w:7+Math.random()*7, h:3+Math.random()*4,
    color:colors[Math.floor(Math.random()*colors.length)],
    speed:2.5+Math.random()*3, angle:Math.random()*Math.PI*2,
    spin:(Math.random()-.5)*.18, drift:(Math.random()-.5)*1.8,
    opacity:.7+Math.random()*.3
  }));
  function frame(){
    ctx.clearRect(0,0,cv.width,cv.height);
    waParticles.forEach(p=>{
      p.y+=p.speed; p.x+=p.drift; p.angle+=p.spin;
      if(p.y>cv.height+20){p.y=-10;p.x=Math.random()*cv.width;}
      ctx.save();
      ctx.globalAlpha=p.opacity;
      ctx.translate(p.x,p.y);
      ctx.rotate(p.angle);
      ctx.fillStyle=p.color;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    waFrame=requestAnimationFrame(frame);
  }
  if(waFrame) cancelAnimationFrame(waFrame);
  frame();
}

function stopWAConfetti(){
  if(waFrame){cancelAnimationFrame(waFrame);waFrame=null;}
  const cv=document.getElementById('wa-confetti');
  cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
}

document.getElementById('wa-ov').addEventListener('click',function(e){
  if(e.target===this) closeAnnounce();
});

render();
</script>
</body>
</html>
