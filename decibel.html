<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Decibel Challenge — Chennai Off-Work Day Outing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07091C;--surf:#0D1035;--surf2:#141740;
  --border:rgba(255,255,255,.1);
  --gold:#F5C842;--teal:#2DD4BF;--text:#F0F0FF;
  --text2:rgba(240,240,255,.6);--text3:rgba(240,240,255,.35);
  --red:#FB7185;--green:#4ECDC4;--orange:#FF8C42;--purple:#A78BFA;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}

/* ── HEADER ── */
.page-header{
  position:relative;overflow:hidden;padding:28px 24px 24px;
  text-align:center;border-bottom:1px solid var(--border)
}
.hdr-logo-bg{position:absolute;inset:0;background:url('bg.png') center/30% no-repeat;opacity:.06;pointer-events:none}
.hdr-fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,9,28,0) 0%,rgba(7,9,28,.7) 100%);pointer-events:none}
.hdr-inner{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.hdr-logo{height:52px;object-fit:contain}
.hdr-titles .t1{font-size:1.5rem;font-weight:900;color:var(--gold)}
.hdr-titles .t2{font-size:.72rem;color:var(--text2);letter-spacing:2.5px;text-transform:uppercase;margin-top:2px}

/* ── SCREENS ── */
.screen{display:none;min-height:calc(100vh - 110px);flex-direction:column;align-items:center}
.screen.active{display:flex}

/* ── SETUP SCREEN ── */
.setup-wrap{width:100%;max-width:860px;padding:28px 18px}
.sec-lbl{font-size:.6rem;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--text3);margin-bottom:12px;text-align:center}

.team-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.team-tile{
  background:var(--surf);border:2px solid var(--border);border-radius:16px;
  padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;
  cursor:pointer;transition:all .18s;position:relative
}
.team-tile:hover{border-color:rgba(255,255,255,.25)}
.team-tile.selected{border-color:var(--gold);background:rgba(245,200,66,.07);box-shadow:0 0 18px rgba(245,200,66,.15)}
.team-tile.done{opacity:.45;cursor:default}
.team-tile.done::after{content:'✓ Done';position:absolute;top:8px;right:8px;font-size:.55rem;font-weight:800;color:var(--teal);letter-spacing:1px}
.tile-logo{width:80px;height:80px;object-fit:contain;border-radius:12px}
.tile-name{font-size:.75rem;font-weight:700;color:var(--text2);text-align:center;line-height:1.3}
.tile-peak{font-size:1.1rem;font-weight:900;color:var(--gold);min-height:1.3em;text-align:center}
.tile-peak.no-score{color:var(--text3);font-size:.7rem;font-weight:500}

.start-btn{
  display:block;width:100%;max-width:340px;margin:0 auto 28px;
  background:var(--gold);color:#07091C;border:none;border-radius:14px;
  font-size:1.1rem;font-weight:900;padding:16px;cursor:pointer;
  font-family:inherit;transition:transform .12s,box-shadow .12s;
  letter-spacing:.3px
}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(245,200,66,.35)}
.start-btn:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none}

/* ── MEASURE SCREEN ── */
.measure-wrap{width:100%;max-width:520px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:20px}

.curr-team-card{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  background:var(--surf);border:2px solid var(--gold);border-radius:18px;
  padding:16px 28px;width:100%;text-align:center
}
.curr-team-logo{width:72px;height:72px;object-fit:contain;border-radius:10px}
.curr-team-name{font-size:1.1rem;font-weight:800;color:var(--gold)}

/* ── COUNTDOWN ── */
.countdown-wrap{display:flex;align-items:center;justify-content:center;width:200px;height:200px}
.countdown-num{font-size:7rem;font-weight:900;color:var(--gold);animation:cdPulse .8s ease infinite;text-shadow:0 0 40px rgba(245,200,66,.5)}
@keyframes cdPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

/* ── METER ── */
.meter-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.meter-svg-wrap{position:relative;width:280px}
.meter-svg-wrap svg{width:100%;overflow:visible}
.db-big{
  font-size:3.2rem;font-weight:900;text-align:center;line-height:1;
  transition:color .1s
}
.db-label{font-size:.65rem;color:var(--text3);letter-spacing:2px;text-transform:uppercase;text-align:center}
.peak-row{
  display:flex;align-items:center;gap:10px;background:var(--surf);
  border:1px solid var(--border);border-radius:10px;padding:8px 18px;
  font-size:.85rem;color:var(--text2)
}
.peak-val{font-size:1.3rem;font-weight:900;color:var(--gold);margin-left:4px}

/* ── TIMER ── */
.timer-wrap{position:relative;width:80px;height:80px;flex-shrink:0}
.timer-svg{width:80px;height:80px}
.timer-num-lbl{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:1.6rem;font-weight:900;color:var(--text)
}

/* ── PULSE BAR (live waveform feel) ── */
.pulse-bars{display:flex;align-items:flex-end;gap:3px;height:50px;justify-content:center;margin-top:4px}
.pulse-bar{width:6px;border-radius:3px;background:var(--teal);transition:height .08s ease;min-height:4px}

/* ── MIC BUTTON ── */
.mic-btn{
  width:72px;height:72px;border-radius:50%;border:2.5px solid var(--red);
  background:rgba(251,113,133,.12);color:var(--red);font-size:1.5rem;
  cursor:pointer;font-family:inherit;transition:all .15s;flex-shrink:0
}
.mic-btn:hover{background:rgba(251,113,133,.25)}
.mic-btn.recording{border-color:var(--red);background:var(--red);color:#fff;animation:micPulse 1s ease infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(251,113,133,.5)}50%{box-shadow:0 0 0 12px rgba(251,113,133,0)}}

.meas-controls{display:flex;align-items:center;justify-content:center;gap:20px;width:100%}

/* ── WINNER OVERLAY ── */
.overlay{
  position:fixed;inset:0;background:rgba(7,9,28,.92);z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .4s
}
.overlay.open{opacity:1;pointer-events:all}
#win-confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.win-inner{position:relative;z-index:2;text-align:center;padding:24px;max-width:460px}
.win-logo{width:120px;height:120px;object-fit:contain;border-radius:18px;margin:0 auto 16px;display:block;animation:wBounce .7s cubic-bezier(.36,2,.6,1) both;animation-delay:.15s}
@keyframes wBounce{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.win-tag{font-size:.65rem;font-weight:900;letter-spacing:6px;color:var(--gold);text-transform:uppercase;animation:wUp .5s ease both;animation-delay:.65s}
@keyframes wUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.win-name{font-size:2.6rem;font-weight:900;color:var(--gold);text-shadow:0 0 50px rgba(245,200,66,.5);margin:8px 0;animation:wPop .55s cubic-bezier(.36,1.5,.6,1) both;animation-delay:.9s}
@keyframes wPop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.win-peak{font-size:1rem;color:var(--text2);animation:wUp .5s ease both;animation-delay:1.1s;margin-bottom:28px}
.win-close{
  background:none;border:1.5px solid rgba(255,255,255,.2);border-radius:12px;
  color:rgba(255,255,255,.5);font-size:.82rem;padding:10px 28px;
  cursor:pointer;font-family:inherit;transition:border-color .15s,color .15s;
  animation:wUp .5s ease both;animation-delay:1.4s
}
.win-close:hover{border-color:rgba(255,255,255,.5);color:var(--text)}

/* final results table */
.results-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;margin:16px 0 24px}
.res-card{background:var(--surf);border:1.5px solid var(--border);border-radius:14px;padding:14px 8px;text-align:center}
.res-card.winner{border-color:var(--gold);background:rgba(245,200,66,.08)}
.res-logo{width:56px;height:56px;object-fit:contain;border-radius:8px;margin-bottom:6px}
.res-name{font-size:.65rem;color:var(--text2);font-weight:700;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-score{font-size:1.4rem;font-weight:900;color:var(--text)}
.res-card.winner .res-score{color:var(--gold)}
.res-lbl{font-size:.52rem;color:var(--text3);letter-spacing:1px;text-transform:uppercase}
.overlay-btns{display:flex;gap:10px;justify-content:center}
.btn-gold{background:var(--gold);color:#07091C;border:none;border-radius:12px;font-weight:800;font-size:.9rem;padding:11px 22px;cursor:pointer;font-family:inherit}
.btn-ghost{background:none;border:1.5px solid var(--border);border-radius:12px;color:var(--text2);font-size:.9rem;padding:11px 22px;cursor:pointer;font-family:inherit}
.btn-ghost:hover{border-color:rgba(255,255,255,.4);color:var(--text)}

@media(max-width:640px){
  .team-grid{grid-template-columns:repeat(2,1fr)}
  .results-grid{grid-template-columns:repeat(2,1fr)}
  .meter-svg-wrap{width:220px}
  .db-big{font-size:2.4rem}
}
</style>
</head>
<body>

<header class="page-header">
  <div class="hdr-logo-bg"></div>
  <div class="hdr-fade"></div>
  <div class="hdr-inner">
    <img src="logo.png" class="hdr-logo" alt="" onerror="this.style.display='none'">
    <div class="hdr-titles">
      <div class="t1">Decibel Challenge</div>
      <div class="t2">Chennai Off-Work Day Outing</div>
    </div>
  </div>
</header>

<!-- ══ SETUP SCREEN ══ -->
<div class="screen active" id="setup-screen">
  <div class="setup-wrap">
    <div class="sec-lbl">Select a team and hit Start</div>
    <div class="team-grid" id="team-grid"></div>
    <button class="start-btn" id="start-btn" disabled onclick="goMeasure()">🎤 Start Recording</button>
  </div>
</div>

<!-- ══ MEASURE SCREEN ══ -->
<div class="screen" id="measure-screen">
  <div class="measure-wrap">
    <div class="curr-team-card">
      <img class="curr-team-logo" id="curr-logo" src="" alt="">
      <div class="curr-team-name" id="curr-name">Team</div>
    </div>

    <!-- Countdown -->
    <div class="countdown-wrap" id="countdown-wrap">
      <div class="countdown-num" id="countdown-num">3</div>
    </div>

    <!-- Live meter (hidden until measuring) -->
    <div id="meter-section" style="display:none;width:100%;flex-direction:column;align-items:center;gap:14px">
      <div class="meter-wrap">
        <div class="meter-svg-wrap">
          <svg viewBox="0 0 280 160" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%"   stop-color="#2DD4BF"/>
                <stop offset="50%"  stop-color="#F5C842"/>
                <stop offset="75%"  stop-color="#FF8C42"/>
                <stop offset="100%" stop-color="#FB7185"/>
              </linearGradient>
            </defs>
            <!-- Background arc -->
            <path d="M 20 150 A 120 120 0 0 1 260 150"
              stroke="#1a1f4a" stroke-width="22" fill="none" stroke-linecap="round"/>
            <!-- Foreground arc -->
            <path id="meter-arc" d="M 20 150 A 120 120 0 0 1 260 150"
              stroke="url(#mGrad)" stroke-width="22" fill="none" stroke-linecap="round"
              stroke-dasharray="0 377" style="transition:stroke-dasharray .08s linear"/>
            <!-- Peak tick -->
            <line id="peak-tick" x1="140" y1="32" x2="140" y2="18" stroke="#F5C842" stroke-width="3" stroke-linecap="round" style="display:none"/>
          </svg>
        </div>
        <div class="db-big" id="db-big" style="color:var(--teal)">0</div>
        <div class="db-label">dB Level</div>
      </div>

      <div class="pulse-bars" id="pulse-bars"></div>

      <div class="peak-row">
        Peak this round: <span class="peak-val" id="peak-val">0</span>
      </div>
    </div>

    <!-- Controls row -->
    <div class="meas-controls">
      <div class="timer-wrap" id="timer-wrap" style="visibility:hidden">
        <svg class="timer-svg" viewBox="0 0 80 80">
          <circle cx="40" cy="40" r="34" fill="none" stroke="#1a1f4a" stroke-width="6"/>
          <circle id="timer-arc" cx="40" cy="40" r="34" fill="none"
            stroke="var(--gold)" stroke-width="6" stroke-linecap="round"
            stroke-dasharray="213.6 213.6" stroke-dashoffset="0"
            transform="rotate(-90 40 40)" style="transition:stroke-dashoffset .2s linear"/>
        </svg>
        <div class="timer-num-lbl" id="timer-num">5</div>
      </div>

      <button class="mic-btn" id="mic-btn" onclick="toggleMic()">🎙️</button>

      <button class="btn-ghost" style="border-radius:10px;padding:10px 16px;font-size:.8rem" onclick="goSetup()">✕ Exit</button>
    </div>
  </div>
</div>

<!-- ══ WINNER OVERLAY ══ -->
<div class="overlay" id="win-ov">
  <canvas id="win-confetti"></canvas>
  <div class="win-inner" id="win-inner"></div>
</div>

<script>
'use strict';

const TEAMS = [
  {name:'Gemini Jammuni', logo:'team1.png', color:'#FF8C42'},
  {name:'Claude Naadu',   logo:'team2.png', color:'#2DD4BF'},
  {name:'Crow Pilot',     logo:'team3.png', color:'#A78BFA'},
  {name:'Chat Cappi Tea', logo:'team4.png', color:'#FB7185'}
];

const DURATION = 5; // seconds per round
const ARC_LEN  = 377; // π * 120 (semicircle path length)

let peaks       = [null, null, null, null]; // peak dB per team
let selected    = null;  // currently selected team index
let audioCtx    = null;
let analyser    = null;
let micStream   = null;
let rafId       = null;
let timerInt    = null;
let timeLeft    = DURATION;
let roundPeak   = 0;
let isRecording = false;

// ── Confetti state ──
let cfFrame = null, cfParticles = [];

// ── Pulse bars ──
const NUM_BARS = 18;

// ── Setup screen ──
function renderSetup(){
  const g = document.getElementById('team-grid');
  g.innerHTML = TEAMS.map((t,i) => {
    const done  = peaks[i] !== null;
    const isSel = i === selected;
    return `<div class="team-tile${isSel?' selected':''}${done?' done':''}"
      onclick="selectTeam(${i})">
      <img class="tile-logo" src="${t.logo}" alt="" onerror="this.style.display='none'">
      <div class="tile-name">${t.name}</div>
      ${done
        ? `<div class="tile-peak">${peaks[i].toFixed(1)}</div>`
        : `<div class="tile-peak no-score">Not played</div>`}
    </div>`;
  }).join('');
  const btn = document.getElementById('start-btn');
  btn.disabled = selected === null || peaks[selected] !== null;
}

function selectTeam(i){
  if(peaks[i] !== null) return;
  selected = i;
  renderSetup();
}

// ── Init pulse bars ──
function initPulseBars(){
  const c = document.getElementById('pulse-bars');
  c.innerHTML = Array.from({length:NUM_BARS}, () =>
    `<div class="pulse-bar" style="height:4px;background:var(--teal)"></div>`
  ).join('');
}

// ── Switch screens ──
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goSetup(){
  stopRecording();
  show('setup-screen');
  renderSetup();
}

async function goMeasure(){
  if(selected === null) return;
  const t = TEAMS[selected];
  document.getElementById('curr-logo').src = t.logo;
  document.getElementById('curr-name').textContent = t.name;
  document.getElementById('curr-logo').style.border = `2px solid ${t.color}`;
  show('measure-screen');
  // Reset UI
  document.getElementById('countdown-wrap').style.display = 'flex';
  document.getElementById('meter-section').style.display = 'none';
  document.getElementById('timer-wrap').style.visibility = 'hidden';
  document.getElementById('mic-btn').className = 'mic-btn';
  document.getElementById('mic-btn').textContent = '🎙️';
  document.getElementById('db-big').textContent = '0';
  document.getElementById('peak-val').textContent = '0';
  roundPeak = 0;
  isRecording = false;
  updateMeterArc(0);
  initPulseBars();
  // Countdown 3-2-1
  await countdown();
  // Show meter, start mic
  document.getElementById('countdown-wrap').style.display = 'none';
  document.getElementById('meter-section').style.display = 'flex';
  document.getElementById('timer-wrap').style.visibility = 'visible';
  startRecording();
}

async function countdown(){
  const el = document.getElementById('countdown-num');
  for(let n = 3; n >= 1; n--){
    el.textContent = n;
    await sleep(900);
  }
  el.textContent = 'GO!';
  await sleep(500);
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

// ── Recording ──
async function startRecording(){
  try{
    micStream = await navigator.mediaDevices.getUserMedia({audio:true, video:false});
  } catch(e){
    alert('Microphone access denied. Please allow mic and try again.');
    goSetup();
    return;
  }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const src = audioCtx.createMediaStreamSource(micStream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  src.connect(analyser);

  isRecording = true;
  roundPeak = 0;
  timeLeft = DURATION;
  document.getElementById('mic-btn').className = 'mic-btn recording';
  document.getElementById('mic-btn').textContent = '⏹';

  updateTimerRing();
  timerInt = setInterval(tickTimer, 200);
  rafId = requestAnimationFrame(meterLoop);
}

function stopRecording(){
  isRecording = false;
  if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
  if(timerInt){ clearInterval(timerInt); timerInt = null; }
  if(micStream){ micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if(audioCtx){ audioCtx.close().catch(()=>{}); audioCtx = null; }
  analyser = null;
}

function toggleMic(){
  if(isRecording) finishRound();
}

function tickTimer(){
  timeLeft -= 0.2;
  if(timeLeft <= 0){ timeLeft = 0; finishRound(); return; }
  updateTimerRing();
  document.getElementById('timer-num').textContent = Math.ceil(timeLeft);
}

function updateTimerRing(){
  const pct = timeLeft / DURATION;
  const circ = 213.6;
  document.getElementById('timer-arc').style.strokeDashoffset = circ * (1 - pct);
  const hue = pct > .5 ? 'var(--gold)' : pct > .25 ? 'var(--orange)' : 'var(--red)';
  document.getElementById('timer-arc').style.stroke = hue;
}

function meterLoop(){
  if(!analyser){ return; }
  const data = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(data);
  let sum = 0;
  for(let i = 0; i < data.length; i++) sum += data[i] * data[i];
  const rms = Math.sqrt(sum / data.length);
  const dbFS = rms > 0 ? 20 * Math.log10(rms) : -100;
  const level = Math.max(0, Math.min(100, dbFS + 100)); // 0-100

  if(level > roundPeak) roundPeak = level;

  // Update display
  const dbEl = document.getElementById('db-big');
  dbEl.textContent = level.toFixed(1);
  dbEl.style.color = levelColor(level);
  document.getElementById('peak-val').textContent = roundPeak.toFixed(1);
  updateMeterArc(level);
  updatePulseBars(data);

  if(isRecording) rafId = requestAnimationFrame(meterLoop);
}

function levelColor(l){
  if(l < 40) return 'var(--teal)';
  if(l < 65) return 'var(--gold)';
  if(l < 82) return 'var(--orange)';
  return 'var(--red)';
}

function updateMeterArc(level){
  const dash = (level / 100) * ARC_LEN;
  document.getElementById('meter-arc').style.strokeDasharray = `${dash} ${ARC_LEN}`;
}

function updatePulseBars(data){
  const bars = document.querySelectorAll('.pulse-bar');
  const step = Math.floor(data.length / NUM_BARS);
  bars.forEach((b, i) => {
    const v = Math.abs(data[i * step] || 0);
    const h = Math.max(4, Math.min(50, v * 200));
    b.style.height = h + 'px';
    b.style.background = levelColor(h * 2);
  });
}

function finishRound(){
  stopRecording();
  peaks[selected] = roundPeak;

  document.getElementById('mic-btn').className = 'mic-btn';
  document.getElementById('mic-btn').textContent = '🎙️';
  document.getElementById('timer-wrap').style.visibility = 'hidden';
  updateMeterArc(roundPeak);
  document.getElementById('db-big').textContent = roundPeak.toFixed(1);
  document.getElementById('peak-val').textContent = roundPeak.toFixed(1);

  const allDone = peaks.every(p => p !== null);
  setTimeout(() => {
    if(allDone) showFinalResult();
    else        showRoundResult();
  }, 800);
}

function showRoundResult(){
  // Quick inline message then back to setup
  const name = TEAMS[selected].name;
  const peak = peaks[selected].toFixed(1);
  // Find next undone team
  const next = peaks.findIndex(p => p === null);
  const msg = next !== -1
    ? `${name} scored ${peak} dB!\n\nNext up: ${TEAMS[next].name}`
    : `${name} scored ${peak} dB!`;
  alert(msg); // simple prompt — could be fancier
  if(next !== -1) selected = next;
  else selected = null;
  goSetup();
}

function showFinalResult(){
  const maxPeak = Math.max(...peaks);
  const winIdx  = peaks.indexOf(maxPeak);
  const winners = peaks.map((p,i) => p === maxPeak ? i : -1).filter(i => i !== -1);
  const isTie   = winners.length > 1;

  const inner = document.getElementById('win-inner');
  if(isTie){
    inner.innerHTML = `
      <div style="display:flex;gap:10px;justify-content:center;margin-bottom:14px">
        ${winners.map(i => `<img src="${TEAMS[i].logo}" style="width:80px;height:80px;object-fit:contain;border-radius:12px">`).join('')}
      </div>
      <div class="win-tag">It's a Tie!</div>
      <div class="win-name" style="font-size:1.8rem">${winners.map(i => TEAMS[i].name).join(' & ')}</div>
      <div class="win-peak">${maxPeak.toFixed(1)} dB each</div>
      ${resultCards()}
      <div class="overlay-btns">
        <button class="btn-gold" onclick="resetGame()">Play Again 🔄</button>
        <button class="btn-ghost" onclick="closeWin()">Close</button>
      </div>`;
  } else {
    const w = TEAMS[winIdx];
    inner.innerHTML = `
      <img class="win-logo" src="${w.logo}" alt="">
      <div class="win-tag" style="color:${w.color}">Winner!</div>
      <div class="win-name" style="color:${w.color};text-shadow:0 0 50px ${w.color}80">${w.name}</div>
      <div class="win-peak">${maxPeak.toFixed(1)} dB</div>
      ${resultCards()}
      <div class="overlay-btns">
        <button class="btn-gold" onclick="resetGame()">Play Again 🔄</button>
        <button class="btn-ghost" onclick="closeWin()">Close</button>
      </div>`;
  }

  document.getElementById('win-ov').classList.add('open');
  startConfetti();
}

function resultCards(){
  const sorted = [...peaks.map((p,i)=>({p,i}))].sort((a,b)=>b.p-a.p);
  const max = Math.max(...peaks);
  return `<div class="results-grid">
    ${sorted.map(({p,i}) => `
      <div class="res-card${p===max?' winner':''}">
        <img class="res-logo" src="${TEAMS[i].logo}" alt="" onerror="this.style.display='none'">
        <div class="res-name">${TEAMS[i].name}</div>
        <div class="res-score">${p !== null ? p.toFixed(1) : '—'}</div>
        <div class="res-lbl">dB</div>
      </div>`).join('')}
  </div>`;
}

function closeWin(){
  document.getElementById('win-ov').classList.remove('open');
  stopConfetti();
}

function resetGame(){
  peaks = [null,null,null,null];
  selected = null;
  closeWin();
  goSetup();
}

// ── Confetti ──
function startConfetti(){
  const cv = document.getElementById('win-confetti');
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  const ctx = cv.getContext('2d');
  const cols = ['#F5C842','#2DD4BF','#FF8C42','#FB7185','#A78BFA','#fff'];
  cfParticles = Array.from({length:140}, () => ({
    x: Math.random()*cv.width, y: -10-Math.random()*200,
    w: 7+Math.random()*7, h: 3+Math.random()*4,
    color: cols[Math.floor(Math.random()*cols.length)],
    speed: 2.5+Math.random()*3, angle: Math.random()*Math.PI*2,
    spin: (Math.random()-.5)*.18, drift: (Math.random()-.5)*1.8
  }));
  (function frame(){
    ctx.clearRect(0,0,cv.width,cv.height);
    cfParticles.forEach(p=>{
      p.y+=p.speed; p.x+=p.drift; p.angle+=p.spin;
      if(p.y>cv.height+20){p.y=-10;p.x=Math.random()*cv.width;}
      ctx.save();ctx.globalAlpha=.85;ctx.translate(p.x,p.y);ctx.rotate(p.angle);
      ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
    });
    cfFrame=requestAnimationFrame(frame);
  })();
}

function stopConfetti(){
  if(cfFrame){cancelAnimationFrame(cfFrame);cfFrame=null;}
  const cv=document.getElementById('win-confetti');
  if(cv) cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
}

// ── Boot ──
renderSetup();
</script>
