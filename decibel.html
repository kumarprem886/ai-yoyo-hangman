<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Decibel Challenge — Chennai Off-Work Day Outing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07091C;--surf:#0D1035;--surf2:#141740;
  --border:rgba(255,255,255,.1);
  --gold:#F5C842;--teal:#2DD4BF;--text:#F0F0FF;
  --text2:rgba(240,240,255,.6);--text3:rgba(240,240,255,.3);
  --red:#FB7185;--orange:#FF8C42;--purple:#A78BFA;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}

/* ── HEADER ── */
.page-header{
  display:flex;align-items:center;gap:12px;padding:12px 20px;
  border-bottom:1px solid var(--border);background:var(--surf);
  flex-shrink:0
}
.hdr-logo{height:38px;object-fit:contain}
.hdr-titles .t1{font-size:1.1rem;font-weight:900;color:var(--gold);line-height:1.1}
.hdr-titles .t2{font-size:.58rem;color:var(--text3);letter-spacing:2.5px;text-transform:uppercase}
.hdr-nav{margin-left:auto;display:flex;gap:8px}
.hdr-nav a{color:var(--text3);font-size:.72rem;text-decoration:none;padding:5px 10px;border:1px solid var(--border);border-radius:8px;transition:color .15s,border-color .15s}
.hdr-nav a:hover{color:var(--text);border-color:rgba(255,255,255,.3)}

/* ── SCREENS ── */
.screen{display:none;flex-direction:column;height:calc(100vh - 63px)}
.screen.active{display:flex}

/* ═══════════════════════════════════════
   SETUP SCREEN
═══════════════════════════════════════ */
#setup-screen{overflow-y:auto;align-items:center;padding:24px 16px}
.setup-inner{width:100%;max-width:820px}

.sec-lbl{font-size:.58rem;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--text3);margin-bottom:12px;text-align:center}

.team-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.team-tile{
  background:var(--surf);border:2px solid var(--border);border-radius:14px;
  padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;
  cursor:pointer;transition:border-color .15s,background .15s;position:relative
}
.team-tile:hover:not(.done){border-color:rgba(255,255,255,.3)}
.team-tile.selected{border-color:var(--gold);background:rgba(245,200,66,.06);box-shadow:0 0 20px rgba(245,200,66,.12)}
.team-tile.done{opacity:.65}
.team-tile.done::after{content:'✓';position:absolute;top:8px;right:10px;color:var(--teal);font-weight:900;font-size:.9rem}
.tile-logo{width:72px;height:72px;object-fit:contain;border-radius:10px}
.tile-name{font-size:.7rem;font-weight:700;color:var(--text2);text-align:center}
.tile-peak{font-size:1.2rem;font-weight:900;color:var(--gold);min-height:1.4em;text-align:center}
.tile-peak.empty{color:var(--text3);font-size:.65rem;font-weight:500}

.settings-bar{
  display:flex;align-items:center;justify-content:center;gap:20px;
  background:var(--surf);border:1px solid var(--border);border-radius:12px;
  padding:14px 20px;margin-bottom:16px;flex-wrap:wrap
}
.setting-field{display:flex;align-items:center;gap:10px}
.setting-field label{font-size:.75rem;color:var(--text2);white-space:nowrap}
.setting-field input[type=number]{
  width:72px;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;
  color:var(--text);font-size:.95rem;font-weight:700;padding:6px 10px;
  text-align:center;font-family:inherit;outline:none
}
.setting-field input[type=number]:focus{border-color:var(--gold)}
.setting-field span{font-size:.72rem;color:var(--text3)}

.start-btn{
  display:block;width:100%;background:var(--gold);color:#07091C;
  border:none;border-radius:12px;font-size:1rem;font-weight:900;
  padding:14px;cursor:pointer;font-family:inherit;
  transition:transform .12s,box-shadow .12s;letter-spacing:.3px
}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(245,200,66,.3)}
.start-btn:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none}

/* ═══════════════════════════════════════
   MEASURE SCREEN
═══════════════════════════════════════ */
#measure-screen{overflow:hidden}

/* Team strip */
.team-strip{
  display:flex;gap:8px;padding:10px 14px;background:var(--surf);
  border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto
}
.strip-tile{
  display:flex;align-items:center;gap:8px;padding:6px 12px;
  border:1.5px solid var(--border);border-radius:10px;flex-shrink:0;
  transition:border-color .2s,background .2s;min-width:0
}
.strip-tile.active{border-color:var(--gold);background:rgba(245,200,66,.06)}
.strip-tile.done-t{border-color:rgba(45,212,191,.3);background:rgba(45,212,191,.05)}
.strip-logo{width:32px;height:32px;object-fit:contain;border-radius:6px}
.strip-info{display:flex;flex-direction:column;min-width:0}
.strip-name{font-size:.65rem;font-weight:700;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}
.strip-score{font-size:.85rem;font-weight:900;color:var(--gold)}
.strip-score.pending{color:var(--text3);font-size:.6rem;font-weight:500}

/* Main layout */
.meas-body{
  display:grid;
  grid-template-columns:88px 1fr 2.2fr;
  gap:10px;padding:10px;
  flex:1;min-height:0
}

/* VU column */
.vu-col{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  background:var(--surf);border:1px solid var(--border);border-radius:12px;
  padding:10px 6px;overflow:hidden;min-height:0
}
#vu-canvas{flex:1;width:100%;min-height:0}
.vu-cur-db{
  font-size:1.4rem;font-weight:900;line-height:1;text-align:center;
  font-variant-numeric:tabular-nums
}
.vu-unit{font-size:.55rem;color:var(--text3);letter-spacing:2px;text-transform:uppercase;text-align:center}

/* Center column */
.center-col{display:flex;flex-direction:column;gap:8px;min-height:0}

.stat-row{display:flex;gap:6px;flex-shrink:0}
.stat-card{
  flex:1;background:var(--surf);border:1px solid var(--border);border-radius:10px;
  padding:10px 8px;text-align:center
}
.stat-card.gold-card{border-color:rgba(245,200,66,.35)}
.stat-val{font-size:1.4rem;font-weight:900;font-variant-numeric:tabular-nums;color:var(--text)}
.stat-card.gold-card .stat-val{color:var(--gold)}
.stat-lbl{font-size:.5rem;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin-top:2px}

.freq-wrap{
  flex:1;background:var(--surf);border:1px solid var(--border);border-radius:10px;
  padding:8px 10px;display:flex;flex-direction:column;gap:4px;overflow:hidden;min-height:0
}
.freq-title{font-size:.55rem;color:var(--text3);letter-spacing:2px;text-transform:uppercase;flex-shrink:0}
#freq-canvas{flex:1;width:100%;min-height:0}

.timer-stop-row{display:flex;align-items:center;gap:8px;flex-shrink:0}
.timer-pill{
  flex:1;background:var(--surf);border:1px solid var(--border);border-radius:10px;
  padding:10px;display:flex;align-items:center;gap:10px;overflow:hidden;position:relative
}
.timer-track{position:absolute;bottom:0;left:0;height:3px;background:var(--gold);transition:width .1s linear;border-radius:0 0 10px 10px}
.timer-time{font-size:1.5rem;font-weight:900;font-variant-numeric:tabular-nums;color:var(--gold);line-height:1}
.timer-lbl{font-size:.55rem;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase}
.stop-btn{
  background:rgba(251,113,133,.12);border:1.5px solid rgba(251,113,133,.4);border-radius:10px;
  color:var(--red);font-size:.8rem;font-weight:800;padding:10px 14px;cursor:pointer;font-family:inherit;
  white-space:nowrap;transition:background .15s
}
.stop-btn:hover{background:rgba(251,113,133,.25)}

/* Right column — history */
.hist-col{
  background:var(--surf);border:1px solid var(--border);border-radius:12px;
  display:flex;flex-direction:column;gap:4px;padding:10px 12px;overflow:hidden;min-height:0
}
.hist-title{font-size:.55rem;color:var(--text3);letter-spacing:2px;text-transform:uppercase;flex-shrink:0;display:flex;justify-content:space-between}
#hist-canvas{flex:1;width:100%;min-height:0}

/* Countdown overlay */
.countdown-ov{
  position:absolute;inset:0;background:rgba(7,9,28,.92);z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px
}
.countdown-ov.hidden{display:none}
.cd-team{font-size:.75rem;color:var(--text2);letter-spacing:2px;text-transform:uppercase}
.cd-num{font-size:8rem;font-weight:900;color:var(--gold);animation:cdPulse .85s ease infinite;text-shadow:0 0 60px rgba(245,200,66,.5);line-height:1}
@keyframes cdPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.9}}

/* ═══════════════════════════════════════
   WINNER OVERLAY
═══════════════════════════════════════ */
.win-ov{
  position:fixed;inset:0;background:rgba(7,9,28,.94);z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .4s;overflow-y:auto;padding:20px
}
.win-ov.open{opacity:1;pointer-events:all}
#win-confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.win-card{
  position:relative;z-index:2;text-align:center;
  background:var(--surf);border:1px solid var(--border);border-radius:20px;
  padding:28px 32px;max-width:520px;width:100%
}
.win-logo{width:96px;height:96px;object-fit:contain;border-radius:14px;margin:0 auto 12px;display:block;animation:wBounce .6s cubic-bezier(.36,2,.6,1) both .1s}
@keyframes wBounce{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.win-tag{font-size:.6rem;font-weight:900;letter-spacing:6px;color:var(--gold);text-transform:uppercase;animation:wUp .4s ease both .6s}
@keyframes wUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.win-name{font-size:2.1rem;font-weight:900;color:var(--gold);text-shadow:0 0 40px rgba(245,200,66,.4);margin:6px 0;animation:wPop .5s cubic-bezier(.36,1.5,.6,1) both .85s}
@keyframes wPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.win-peak{font-size:.9rem;color:var(--text2);animation:wUp .4s ease both 1s;margin-bottom:18px}

.results-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;animation:wUp .4s ease both 1.1s}
.res-card{background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:10px 6px;text-align:center}
.res-card.winner-card{border-color:var(--gold);background:rgba(245,200,66,.07)}
.res-logo{width:44px;height:44px;object-fit:contain;border-radius:7px;margin-bottom:5px}
.res-name{font-size:.55rem;color:var(--text2);font-weight:700;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-score{font-size:1.2rem;font-weight:900}
.res-score-lbl{font-size:.45rem;color:var(--text3);letter-spacing:1px;text-transform:uppercase}

.sb-push-btn{
  display:block;width:100%;background:var(--teal);color:#07091C;border:none;
  border-radius:10px;font-weight:900;font-size:.82rem;padding:10px;
  cursor:pointer;font-family:inherit;margin-bottom:8px;animation:wUp .4s ease both 1.2s
}
.win-btns{display:flex;gap:8px;justify-content:center;animation:wUp .4s ease both 1.3s}
.btn-gold{background:var(--gold);color:#07091C;border:none;border-radius:10px;font-weight:900;font-size:.85rem;padding:10px 20px;cursor:pointer;font-family:inherit}
.btn-ghost{background:none;border:1.5px solid var(--border);border-radius:10px;color:var(--text2);font-size:.85rem;padding:10px 20px;cursor:pointer;font-family:inherit}
.btn-ghost:hover{border-color:rgba(255,255,255,.35);color:var(--text)}

@media(max-width:700px){
  .meas-body{grid-template-columns:60px 1fr;grid-template-rows:auto 1fr}
  .hist-col{grid-column:1/-1}
  .results-grid{grid-template-columns:repeat(2,1fr)}
  .team-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<header class="page-header">
  <img src="logo.png" class="hdr-logo" alt="" onerror="this.style.display='none'">
  <div class="hdr-titles">
    <div class="t1">Decibel Challenge</div>
    <div class="t2">Chennai Off-Work Day Outing</div>
  </div>
  <nav class="hdr-nav">
    <a href="index.html">🎮 Hangman</a>
    <a href="scoreboard.html">📊 Scoreboard</a>
  </nav>
</header>

<!-- ══ SETUP SCREEN ══ -->
<div class="screen active" id="setup-screen">
  <div class="setup-inner">
    <div class="sec-lbl" style="margin-top:16px">Select a team — then hit Start</div>
    <div class="team-grid" id="team-grid"></div>

    <div class="settings-bar">
      <div class="setting-field">
        <label for="time-input">⏱ Recording time</label>
        <input type="number" id="time-input" value="5" min="3" max="60">
        <span>seconds (3 – 60)</span>
      </div>
    </div>

    <button class="start-btn" id="start-btn" disabled onclick="goMeasure()">🎙️ Start Recording</button>
    <button class="start-btn" id="finish-btn" disabled onclick="showFinalResult()"
      style="margin-top:10px;background:var(--surf);color:var(--gold);border:2px solid rgba(245,200,66,.45)">
      🏆 Finish Game &amp; Announce Winner
    </button>
  </div>
</div>

<!-- ══ MEASURE SCREEN ══ -->
<div class="screen" id="measure-screen" style="position:relative">

  <!-- Countdown overlay -->
  <div class="countdown-ov" id="cd-ov">
    <div class="cd-team" id="cd-team-lbl">Get Ready…</div>
    <div class="cd-num" id="cd-num">3</div>
  </div>

  <!-- Team strip -->
  <div class="team-strip" id="team-strip"></div>

  <!-- Main layout: VU | center | history -->
  <div class="meas-body">

    <!-- VU Bar column -->
    <div class="vu-col">
      <canvas id="vu-canvas"></canvas>
      <div class="vu-cur-db" id="vu-cur-db" style="color:var(--teal)">0</div>
      <div class="vu-unit">dB Level</div>
    </div>

    <!-- Center column -->
    <div class="center-col">

      <div class="stat-row">
        <div class="stat-card">
          <div class="stat-val" id="stat-min">—</div>
          <div class="stat-lbl">Min</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="stat-avg">—</div>
          <div class="stat-lbl">Avg</div>
        </div>
        <div class="stat-card gold-card">
          <div class="stat-val" id="stat-max">—</div>
          <div class="stat-lbl">Peak</div>
        </div>
      </div>

      <div class="freq-wrap">
        <div class="freq-title">⬛ Frequency Spectrum</div>
        <canvas id="freq-canvas"></canvas>
      </div>

      <div class="timer-stop-row">
        <div class="timer-pill">
          <div class="timer-track" id="timer-track" style="width:100%"></div>
          <div style="flex:1">
            <div class="timer-time" id="timer-time">5.0</div>
            <div class="timer-lbl" id="timer-lbl">Seconds left</div>
          </div>
        </div>
        <button class="stop-btn" id="stop-btn" onclick="finishRound()">⏹ Stop</button>
      </div>

      <!-- Shown after recording ends -->
      <div id="done-banner" style="display:none;background:rgba(45,212,191,.1);border:1.5px solid rgba(45,212,191,.4);border-radius:12px;padding:12px 14px;display:none;flex-direction:column;gap:8px">
        <div style="font-size:.6rem;color:var(--teal);letter-spacing:2px;text-transform:uppercase;font-weight:800">Recording complete</div>
        <div style="font-size:.85rem;color:var(--text2)">Peak saved for <strong id="done-team-name" style="color:var(--gold)"></strong></div>
        <button onclick="saveAndContinue()" style="background:var(--gold);color:#07091C;border:none;border-radius:10px;font-weight:900;font-size:.9rem;padding:12px;cursor:pointer;font-family:inherit;width:100%">
          ✓ Back to Team Selection
        </button>
      </div>

    </div>

    <!-- History chart column -->
    <div class="hist-col">
      <div class="hist-title">
        <span>📈 History</span>
        <span id="hist-range-lbl" style="font-weight:700;color:var(--teal)">Live</span>
      </div>
      <canvas id="hist-canvas"></canvas>
    </div>

  </div>
</div>

<!-- ══ WINNER OVERLAY ══ -->
<div class="win-ov" id="win-ov">
  <canvas id="win-confetti"></canvas>
  <div class="win-card" id="win-card"></div>
</div>

<script>
'use strict';

const TEAMS = [
  {name:'Gemini Jammuni', logo:'team1.png', color:'#FF8C42'},
  {name:'Claude Naadu',   logo:'team2.png', color:'#2DD4BF'},
  {name:'Crow Pilot',     logo:'team3.png', color:'#A78BFA'},
  {name:'Chat Cappi Tea', logo:'team4.png', color:'#FB7185'}
];

// ── State ──
let peaks        = [null, null, null, null];
let selected     = null;
let timeLimitSecs = 5;

let audioCtx = null, analyser = null, micStream = null;
let rafId = null, timerInt = null;
let isRecording = false;
let timeLeft = 5;
let roundPeak = 0;
let statMin = null, statSum = 0, statCount = 0;
let vuPeak = 0, vuPeakTimer = 0;

const HIST_RATE_MS = 80;
let histBuf = [], lastHistMs = 0, roundStartMs = 0;

let vuCanvas, vuCtx, freqCanvas, freqCtx, histCanvas, histCtx;
const DPR = () => window.devicePixelRatio || 1;

// ── Setup ──
function renderSetup() {
  document.getElementById('team-grid').innerHTML = TEAMS.map((t, i) => {
    const done = peaks[i] !== null, sel = i === selected;
    return `<div class="team-tile${sel?' selected':''}${done?' done':''}" onclick="selectTeam(${i})">
      <img class="tile-logo" src="${t.logo}" alt="" onerror="this.style.display='none'">
      <div class="tile-name">${t.name}</div>
      ${done ? `<div class="tile-peak">${peaks[i].toFixed(1)} <span style="font-size:.55rem;color:var(--text3)">dB</span></div>`
             : `<div class="tile-peak empty">Not played yet</div>`}
    </div>`;
  }).join('');
  document.getElementById('start-btn').disabled = selected === null;
  document.getElementById('finish-btn').disabled = peaks.every(p => p === null);
}

function selectTeam(i) {
  // Always allow switching teams
  selected = i; renderSetup();
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goSetup() {
  stopAll(); show('setup-screen'); renderSetup();
}

async function goMeasure() {
  if (selected === null) return;
  timeLimitSecs = Math.max(3, Math.min(60, parseInt(document.getElementById('time-input').value, 10) || 5));
  timeLeft = timeLimitSecs;

  renderTeamStrip();
  show('measure-screen');
  initCanvases();

  // Countdown
  const cdOv = document.getElementById('cd-ov');
  const cdNum = document.getElementById('cd-num');
  cdOv.classList.remove('hidden');
  document.getElementById('cd-team-lbl').textContent = TEAMS[selected].name + ' — Get Ready!';
  for (let n = 3; n >= 1; n--) { cdNum.textContent = n; await sleep(850); }
  cdNum.textContent = 'GO!';
  await sleep(450);
  cdOv.classList.add('hidden');

  // Reset stats
  roundPeak = 0; statMin = null; statSum = 0; statCount = 0;
  histBuf = []; vuPeak = 0; vuPeakTimer = 0; lastHistMs = 0;
  updateStats();
  document.getElementById('timer-track').style.width = '100%';
  document.getElementById('timer-time').textContent = timeLimitSecs.toFixed(1);

  await startRecording();
}

function renderTeamStrip() {
  document.getElementById('team-strip').innerHTML = TEAMS.map((t, i) => {
    const isActive = i === selected, isDone = peaks[i] !== null;
    return `<div class="strip-tile${isActive?' active':''}${isDone&&!isActive?' done-t':''}">
      <img class="strip-logo" src="${t.logo}" alt="" onerror="this.style.display='none'">
      <div class="strip-info">
        <div class="strip-name">${t.name}</div>
        ${isDone ? `<div class="strip-score">${peaks[i].toFixed(1)} dB</div>`
                 : isActive ? `<div class="strip-score" style="color:var(--red)">● REC</div>`
                            : `<div class="strip-score pending">waiting</div>`}
      </div>
    </div>`;
  }).join('');
}

// ── Canvas ──
function initCanvases() {
  vuCanvas   = document.getElementById('vu-canvas');
  freqCanvas = document.getElementById('freq-canvas');
  histCanvas = document.getElementById('hist-canvas');
  vuCtx      = vuCanvas.getContext('2d');
  freqCtx    = freqCanvas.getContext('2d');
  histCtx    = histCanvas.getContext('2d');
  sizeCanvases();
}

function sizeCanvases() {
  const dpr = DPR();
  [vuCanvas, freqCanvas, histCanvas].forEach(cv => {
    if (!cv) return;
    const r = cv.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const nw = Math.round(r.width * dpr), nh = Math.round(r.height * dpr);
    if (cv.width !== nw || cv.height !== nh) {
      cv.width = nw; cv.height = nh;
    }
  });
}

// ── Audio ──
async function startRecording() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({audio: true, video: false});
  } catch(e) {
    alert('Microphone access denied. Please allow the mic and try again.');
    goSetup(); return;
  }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const src = audioCtx.createMediaStreamSource(micStream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.75;
  src.connect(analyser);

  isRecording = true;
  roundStartMs = performance.now();
  timerInt = setInterval(tickTimer, 100);
  rafId = requestAnimationFrame(renderFrame);
}

function stopAll() {
  isRecording = false;
  if (rafId)    { cancelAnimationFrame(rafId); rafId = null; }
  if (timerInt) { clearInterval(timerInt); timerInt = null; }
  if (micStream){ micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (audioCtx) { audioCtx.close().catch(()=>{}); audioCtx = null; }
  analyser = null;
}

function tickTimer() {
  timeLeft -= 0.1;
  if (timeLeft <= 0) { timeLeft = 0; finishRound(); return; }
  const pct = (timeLeft / timeLimitSecs) * 100;
  const track = document.getElementById('timer-track');
  track.style.width = pct + '%';
  track.style.background = pct > 40 ? 'var(--gold)' : pct > 20 ? 'var(--orange)' : 'var(--red)';
  document.getElementById('timer-time').textContent = timeLeft.toFixed(1);
}

// ── Render loop ──
function renderFrame() {
  if (!analyser) return;

  const level = getRMSLevel();

  if (statMin === null || level < statMin) statMin = level;
  if (level > roundPeak) { roundPeak = level; vuPeakTimer = 90; }
  statSum += level; statCount++;
  if (vuPeakTimer > 0) vuPeakTimer--;
  else if (vuPeak > 0) vuPeak = Math.max(0, vuPeak - 0.25);
  if (level > vuPeak) vuPeak = level;

  const now = performance.now();
  if (now - lastHistMs >= HIST_RATE_MS) {
    histBuf.push({t: now - roundStartMs, level});
    lastHistMs = now;
  }

  updateStats();
  const dbEl = document.getElementById('vu-cur-db');
  dbEl.textContent = level.toFixed(1);
  dbEl.style.color = levelColor(level);

  sizeCanvases();
  drawVU(level, vuPeak);
  drawFreq();
  drawHist();

  if (isRecording) rafId = requestAnimationFrame(renderFrame);
}

function getRMSLevel() {
  const data = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(data);
  let sum = 0;
  for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
  const rms = Math.sqrt(sum / data.length);
  if (rms <= 0) return 0;
  // Power-curve scale: normalise linear dBFS to 0-1, then square it.
  // This makes the top end hard to reach — a very loud shout (~-10 dBFS)
  // shows ~81, and only near-clipping input reaches 95+.
  const normalized = Math.max(0, Math.min(1, (20 * Math.log10(rms) + 100) / 100));
  return Math.pow(normalized, 2) * 100;
}

function updateStats() {
  const f = v => (v !== null && v !== undefined && isFinite(v)) ? v.toFixed(1) : '—';
  document.getElementById('stat-min').textContent = f(statMin);
  document.getElementById('stat-avg').textContent = statCount > 0 ? f(statSum / statCount) : '—';
  document.getElementById('stat-max').textContent = f(roundPeak);
}

function levelColor(l) {
  if (l < 60) return '#2DD4BF';
  if (l < 75) return '#F5C842';
  if (l < 85) return '#FF8C42';
  return '#FB7185';
}

// ── VU Bar ──
function drawVU(level, peak) {
  if (!vuCtx) return;
  const dpr = DPR();
  const W = vuCanvas.width / dpr, H = vuCanvas.height / dpr;
  const ctx = vuCtx;

  // Reset transform
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const barW = Math.floor(W * 0.46);
  const lX   = barW + 3;

  // Bar background
  ctx.fillStyle = '#08091f';
  ctx.fillRect(0, 0, barW, H);

  // Gradient fill
  const fillH = Math.round((level / 100) * H);
  if (fillH > 0) {
    const g = ctx.createLinearGradient(0, H, 0, 0);
    g.addColorStop(0,    '#2DD4BF');
    g.addColorStop(0.58, '#2DD4BF');
    g.addColorStop(0.60, '#F5C842');
    g.addColorStop(0.73, '#F5C842');
    g.addColorStop(0.75, '#FF8C42');
    g.addColorStop(0.84, '#FF8C42');
    g.addColorStop(0.85, '#FB7185');
    g.addColorStop(1,    '#FB7185');
    ctx.fillStyle = g;
    ctx.fillRect(0, H - fillH, barW, fillH);
  }

  // Segment dividers
  ctx.fillStyle = 'rgba(7,9,28,.5)';
  for (let i = 5; i < 100; i += 5) {
    const y = H - Math.round((i / 100) * H);
    ctx.fillRect(0, y, barW, i % 10 === 0 ? 2 : 1);
  }

  // Peak hold marker
  if (peak > 1) {
    const py = H - Math.round((peak / 100) * H);
    ctx.shadowColor = '#F5C842';
    ctx.shadowBlur = 7;
    ctx.fillStyle = '#F5C842';
    ctx.fillRect(0, py - 2, barW, 3);
    ctx.shadowBlur = 0;
  }

  // Scale labels + ticks
  const fs = Math.max(8, Math.round(W * 0.15));
  ctx.font = `${fs}px 'Consolas', monospace`;
  ctx.textAlign = 'left';
  for (let l = 0; l <= 100; l += 10) {
    const y = H - Math.round((l / 100) * H);
    const col = l >= 85 ? '#FB7185' : l >= 75 ? '#FF8C42' : l >= 60 ? '#F5C842' : 'rgba(240,240,255,.32)';
    ctx.fillStyle = col;
    ctx.fillRect(lX, y - 1, l % 20 === 0 ? 6 : 3, 2);
    if (l % 20 === 0) {
      ctx.fillStyle = 'rgba(240,240,255,.45)';
      ctx.fillText(String(l), lX + 9, y + Math.round(fs * 0.38));
    }
  }
}

// ── Frequency Spectrum ──
function drawFreq() {
  if (!freqCtx || !analyser) return;
  const dpr = DPR();
  const W = freqCanvas.width / dpr, H = freqCanvas.height / dpr;
  const ctx = freqCtx;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const freqData = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(freqData);

  const NUM = 48, gap = 2;
  const barW = Math.max(2, (W - gap * (NUM - 1)) / NUM);
  const nyquist = audioCtx.sampleRate / 2;
  const minLog = Math.log10(60), maxLog = Math.log10(nyquist);
  const labelH = 13, chartH = H - labelH;

  for (let i = 0; i < NUM; i++) {
    const f1 = Math.pow(10, minLog + (i / NUM) * (maxLog - minLog));
    const f2 = Math.pow(10, minLog + ((i+1) / NUM) * (maxLog - minLog));
    const b1 = Math.max(0, Math.floor(f1 / nyquist * freqData.length));
    const b2 = Math.min(freqData.length - 1, Math.ceil(f2 / nyquist * freqData.length));
    let sum = 0, cnt = 0;
    for (let j = b1; j <= b2; j++) { sum += freqData[j]; cnt++; }
    const v = cnt > 0 ? sum / cnt / 255 : 0;
    const bH = Math.round(v * chartH * 0.97);
    const x = Math.round(i * (barW + gap));
    const t = i / NUM;
    const col = t < 0.22 ? '#FF8C42' : t < 0.52 ? '#F5C842' : '#2DD4BF';

    ctx.fillStyle = 'rgba(255,255,255,.04)';
    ctx.fillRect(x, 0, barW, chartH);

    if (bH > 0) {
      ctx.shadowColor = col;
      ctx.shadowBlur = bH > chartH * 0.55 ? 8 : 3;
      ctx.fillStyle = col;
      ctx.fillRect(x, chartH - bH, barW, bH);
      ctx.shadowBlur = 0;
    }
  }

  ctx.fillStyle = 'rgba(240,240,255,.28)';
  ctx.font = '9px sans-serif';
  ctx.textAlign = 'left';   ctx.fillText('Low / Bass', 2, H - 1);
  ctx.textAlign = 'center'; ctx.fillText('Mid / Voice', W/2, H - 1);
  ctx.textAlign = 'right';  ctx.fillText('High / Treble', W - 2, H - 1);
}

// ── History Chart ──
function drawHist() {
  if (!histCtx) return;
  const dpr = DPR();
  const W = histCanvas.width / dpr, H = histCanvas.height / dpr;
  const ctx = histCtx;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const PL = 34, PR = 8, PT = 10, PB = 16;
  const cW = W - PL - PR, cH = H - PT - PB;

  // Y grid + labels
  ctx.font = '9px Consolas, monospace';
  ctx.textAlign = 'right';
  [0, 20, 40, 60, 80, 100].forEach(l => {
    const y = PT + cH - (l / 100) * cH;
    ctx.strokeStyle = 'rgba(255,255,255,.06)';
    ctx.lineWidth = 1; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(PL, y); ctx.lineTo(W - PR, y); ctx.stroke();
    ctx.fillStyle = 'rgba(240,240,255,.28)';
    ctx.fillText(l, PL - 3, y + 3);
  });

  // Reference lines
  [[75,'#FF8C42','Warning'],[90,'#FB7185','Danger']].forEach(([l, col, lbl]) => {
    const y = PT + cH - (l / 100) * cH;
    ctx.strokeStyle = col; ctx.setLineDash([5,4]); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(PL, y); ctx.lineTo(W - PR, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = col; ctx.textAlign = 'right';
    ctx.fillText(lbl, W - PR - 2, y - 3);
  });

  if (histBuf.length < 2) {
    document.getElementById('hist-range-lbl').textContent = 'Live';
    return;
  }

  const dispMs = timeLimitSecs * 1000;
  const latestT = histBuf[histBuf.length - 1].t;
  const startT  = Math.max(0, latestT - dispMs);
  document.getElementById('hist-range-lbl').textContent = (latestT / 1000).toFixed(1) + 's';

  const pts = histBuf
    .filter(p => p.t >= startT)
    .map(p => ({
      x: PL + ((p.t - startT) / dispMs) * cW,
      y: PT + cH - (p.level / 100) * cH
    }));

  if (pts.length < 2) return;

  // Smooth curve segments — caller must set start position first
  function curvePath(arr) {
    for (let i = 1; i < arr.length - 1; i++) {
      const mx = (arr[i].x + arr[i+1].x) / 2;
      const my = (arr[i].y + arr[i+1].y) / 2;
      ctx.quadraticCurveTo(arr[i].x, arr[i].y, mx, my);
    }
    ctx.lineTo(arr[arr.length-1].x, arr[arr.length-1].y);
  }

  // Filled area — anchor at baseline, rise to first point, then trace curve
  ctx.beginPath();
  ctx.moveTo(pts[0].x, PT + cH);     // baseline of first point
  ctx.lineTo(pts[0].x, pts[0].y);    // up to first data point
  curvePath(pts);
  ctx.lineTo(pts[pts.length-1].x, PT + cH);
  ctx.closePath();
  const aG = ctx.createLinearGradient(0, PT, 0, PT + cH);
  aG.addColorStop(0, 'rgba(45,212,191,.5)');
  aG.addColorStop(1, 'rgba(45,212,191,.03)');
  ctx.fillStyle = aG; ctx.fill();

  // Line
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  curvePath(pts);
  ctx.strokeStyle = '#2DD4BF';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#2DD4BF'; ctx.shadowBlur = 5;
  ctx.stroke(); ctx.shadowBlur = 0;

  // X labels
  ctx.fillStyle = 'rgba(240,240,255,.28)';
  ctx.font = '9px Consolas, monospace';
  ctx.textAlign = 'center';
  const step = Math.max(1, Math.round(timeLimitSecs / 6));
  for (let s = 0; s <= timeLimitSecs; s += step) {
    ctx.fillText(s + 's', PL + (s / timeLimitSecs) * cW, H - 1);
  }
}

// ── Finish Round ──
function finishRound() {
  if (!isRecording) return;
  stopAll();
  peaks[selected] = roundPeak;

  // Update timer UI to "done"
  document.getElementById('timer-track').style.width = '0%';
  document.getElementById('timer-time').textContent = '0.0';
  document.getElementById('timer-lbl').textContent = 'Done';
  document.getElementById('stop-btn').style.display = 'none';

  // Show done banner with save button
  const banner = document.getElementById('done-banner');
  document.getElementById('done-team-name').textContent = TEAMS[selected].name;
  banner.style.display = 'flex';
}

function saveAndContinue() {
  document.getElementById('done-banner').style.display = 'none';
  document.getElementById('stop-btn').style.display = '';
  goSetup();
}

// ── Final Results ──
function showFinalResult() {
  const played = peaks.filter(p => p !== null);
  if (played.length === 0) return;
  const maxPeak = Math.max(...played);
  // All teams that share the top score (within 0.05 dB float tolerance)
  const winIndices = peaks.map((p,i) => (p !== null && Math.abs(p - maxPeak) < 0.05) ? i : -1).filter(i => i !== -1);
  const isTie = winIndices.length > 1;

  const sorted = peaks.map((p,i) => ({p,i})).sort((a,b) => (b.p||0) - (a.p||0));
  const cards = sorted.map(({p,i}) => `
    <div class="res-card${winIndices.includes(i)?' winner-card':''}">
      <img class="res-logo" src="${TEAMS[i].logo}" alt="" onerror="this.style.display='none'">
      <div class="res-name">${TEAMS[i].name}</div>
      <div class="res-score" style="color:${winIndices.includes(i)?'var(--gold)':TEAMS[i].color}">${p!==null?p.toFixed(1):'—'}</div>
      <div class="res-score-lbl">dB Level</div>
    </div>`).join('');

  const sbLabel = isTie
    ? `+10 pts each to tied teams`
    : `+10 pts to ${TEAMS[winIndices[0]].name}`;

  let winnerHtml;
  if (isTie) {
    winnerHtml = `
      <div style="display:flex;justify-content:center;gap:10px;margin-bottom:10px">
        ${winIndices.map(i=>`<img src="${TEAMS[i].logo}" style="width:72px;height:72px;object-fit:contain;border-radius:12px;border:2px solid var(--gold)" onerror="this.style.display='none'">`).join('')}
      </div>
      <div class="win-tag">It's a Tie!</div>
      <div class="win-name" style="font-size:1.4rem">${winIndices.map(i=>TEAMS[i].name).join(' &amp; ')}</div>
      <div class="win-peak">${maxPeak.toFixed(1)} dB Level each</div>`;
  } else {
    const w = TEAMS[winIndices[0]];
    winnerHtml = `
      <img class="win-logo" src="${w.logo}" alt="" onerror="this.style.display='none'" style="border:2px solid ${w.color}">
      <div class="win-tag">Loudest Team!</div>
      <div class="win-name" style="color:${w.color};text-shadow:0 0 40px ${w.color}80">${w.name}</div>
      <div class="win-peak">${maxPeak.toFixed(1)} dB Level</div>`;
  }

  document.getElementById('win-card').innerHTML = `
    ${winnerHtml}
    <div class="results-grid">${cards}</div>
    <button class="sb-push-btn" onclick="pushToScoreboard()">📊 Main Scoreboard &nbsp;·&nbsp; ${sbLabel}</button>
    <div class="win-btns">
      <button class="btn-gold" onclick="resetGame()">Play Again 🔄</button>
      <button class="btn-ghost" onclick="closeWin()">Close</button>
    </div>`;

  document.getElementById('win-ov').classList.add('open');
  startConfetti();
}

function pushToScoreboard() {
  const TC = ['#FF8C42','#2DD4BF','#A78BFA','#FB7185'];
  let sb;
  try { sb = JSON.parse(localStorage.getItem('chennai_outing_sb')); } catch(e) {}
  if (!sb || !sb.activities) sb = {teams:[], activities:[]};
  sb.teams = TEAMS.map((t,i) => ({name:t.name, color:TC[i]}));

  // Find existing activity whose name contains "decibel" (case-insensitive), or create "Decibel Meter"
  let act = sb.activities.find(a => a.name.toLowerCase().includes('decibel'));
  if (!act) {
    act = {name:'Decibel Meter', scores:[0,0,0,0]};
    sb.activities.push(act);
  }
  if (!act.scores) act.scores = [0,0,0,0];
  while (act.scores.length < 4) act.scores.push(0);

  // Add 10 points to every team tied at the top peak
  const played = peaks.filter(p => p !== null);
  if (played.length > 0) {
    const maxPeak = Math.max(...played);
    peaks.forEach((p, i) => {
      if (p !== null && Math.abs(p - maxPeak) < 0.05) {
        act.scores[i] = (act.scores[i] || 0) + 10;
      }
    });
  }

  localStorage.setItem('chennai_outing_sb', JSON.stringify(sb));
  window.location.href = 'scoreboard.html';
}

function closeWin() {
  document.getElementById('win-ov').classList.remove('open');
  stopConfetti(); goSetup();
}
function resetGame() { peaks=[null,null,null,null]; selected=null; closeWin(); }

// ── Confetti ──
let cfRaf=null, cfParts=[];
function startConfetti() {
  const cv = document.getElementById('win-confetti');
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  const ctx = cv.getContext('2d');
  const cols = ['#F5C842','#2DD4BF','#FF8C42','#FB7185','#A78BFA','#fff'];
  cfParts = Array.from({length:150}, () => ({
    x:Math.random()*cv.width, y:-20-Math.random()*300,
    w:6+Math.random()*8, h:3+Math.random()*5,
    color:cols[Math.floor(Math.random()*cols.length)],
    speed:2+Math.random()*3.5, angle:Math.random()*Math.PI*2,
    spin:(Math.random()-.5)*.2, drift:(Math.random()-.5)*2
  }));
  (function frame(){
    ctx.clearRect(0,0,cv.width,cv.height);
    cfParts.forEach(p=>{
      p.y+=p.speed; p.x+=p.drift; p.angle+=p.spin;
      if(p.y>cv.height+20){p.y=-10;p.x=Math.random()*cv.width;}
      ctx.save();ctx.globalAlpha=.9;ctx.translate(p.x,p.y);ctx.rotate(p.angle);
      ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
    });
    cfRaf=requestAnimationFrame(frame);
  })();
}
function stopConfetti(){
  if(cfRaf){cancelAnimationFrame(cfRaf);cfRaf=null;}
  const cv=document.getElementById('win-confetti');
  if(cv) cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

window.addEventListener('resize', ()=>{ if(isRecording) sizeCanvases(); });
renderSetup();
</script>
